    <link rel="stylesheet" href="hark.css" />
    <style>
      body { background: #fff; }
      .x-app {
        --navy: #0B1B3F; --blue: #2563FF; --blue-d: #1A4FE0; --muted: #55607A; --line: #E3E8F2; --soft: #F4F7FD;
        --sh: 0 1px 2px rgba(11,27,63,.06), 0 8px 24px rgba(11,27,63,.07);
        --sh-h: 0 2px 4px rgba(11,27,63,.08), 0 14px 32px rgba(37,99,255,.14);
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        color: var(--navy); background: #fff; font-size: 16px; line-height: 1.55; min-height: 100vh;
        display: flex; flex-direction: column;
      }
      .x-app h1, .x-app h2, .x-app h3 { color: var(--navy); letter-spacing: -.02em; line-height: 1.15; }
      .x-app h2 { font-size: clamp(22px, 3vw, 28px); font-weight: 700; }
      .x-app h3 { font-size: 17px; font-weight: 650; }
      .x-app p { color: var(--muted); }
      .x-app a { text-decoration: none; }
      .x-app button, .x-app input, .x-app select { font: inherit; color: inherit; }
      .x-wrap { width: 100%; max-width: 1120px; margin: 0 auto; padding: 0 20px; }
      .x-sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

      /* header */
      .x-top { position: sticky; top: 0; z-index: 30; background: rgba(255,255,255,.92); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-bottom: 1px solid var(--line); }
      .x-bar { display: flex; align-items: center; gap: 16px; min-height: 64px; flex-wrap: wrap; }
      .x-logo { display: inline-flex; align-items: center; gap: 10px; font-weight: 800; font-size: 21px; color: var(--navy); letter-spacing: -.03em; min-height: 44px; }
      .x-nav { display: flex; gap: 4px; margin-left: auto; overflow-x: auto; scrollbar-width: none; }
      .x-nav a { display: inline-flex; align-items: center; min-height: 44px; padding: 0 14px; border-radius: 999px; color: var(--navy); font-weight: 550; font-size: 15px; white-space: nowrap; transition: background .2s, color .2s; }
      .x-nav a:hover { background: var(--soft); }
      .x-nav a.is-on { background: #E8EEFF; color: #1A47C9; }
      .x-sbtn { display: none; width: 44px; height: 44px; border: 1px solid var(--line); border-radius: 12px; background: #fff; place-items: center; cursor: pointer; margin-left: auto; color: var(--navy); }

        .x-sbtn { display: grid; }

      }

      /* views */
      .x-view { flex: 1; }
      .x-view > * { animation: x-in .35s ease both; }
      @keyframes x-in { from { opacity: 0; transform: translateY(6px); } }
      @media (prefers-reduced-motion: reduce) { .x-view > * { animation: none; } .x-app * { transition: none !important; } }
      .x-sec { padding: 40px 0 8px; }
      .x-sec > .x-wrap > h2 { margin-bottom: 6px; }
      .x-sec .x-lead { margin-bottom: 20px; }
      .x-hero { background: radial-gradient(1000px 400px at 80% -10%, #DCE6FF 0, transparent 60%), linear-gradient(180deg, #F4F7FF, #fff); padding: 48px 0 32px; }
      .x-hero h1 { font-size: clamp(32px, 6vw, 56px); font-weight: 800; max-width: 16ch; letter-spacing: -.035em; }
      .x-hero .x-lead { font-size: clamp(17px, 2vw, 20px); margin: 14px 0 26px; max-width: 46ch; }
      .x-search { position: relative; max-width: 680px; }
      .x-search svg { position: absolute; left: 18px; top: 50%; transform: translateY(-50%); color: var(--blue); pointer-events: none; }
      .x-search input { width: 100%; height: 60px; border: 1.5px solid var(--line); border-radius: 18px; padding: 0 20px 0 52px; font-size: 17px; background: #fff; box-shadow: var(--sh); outline: none; transition: border-color .2s, box-shadow .2s; }
      .x-search.is-flash input { animation: x-flash .9s ease; border-color: var(--blue); }
      @keyframes x-flash { 30% { box-shadow: 0 0 0 8px rgba(37,99,255,.25), var(--sh); } }
      .x-search input:focus { border-color: var(--blue); box-shadow: 0 0 0 4px rgba(37,99,255,.15), var(--sh); }
      .x-results { margin-top: 20px; }
      .x-results:empty { display: none; }
      .x-empty { padding: 16px; border-radius: 14px; background: var(--soft); }

      /* cards */
      .x-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 14px; }
      .x-card { position: relative; display: flex; gap: 14px; align-items: flex-start; padding: 18px; border-radius: 18px; background: #fff; border: 1px solid var(--line); box-shadow: var(--sh); color: var(--navy); transition: transform .2s, box-shadow .2s, border-color .2s; }
      a.x-card:hover { transform: translateY(-2px); box-shadow: var(--sh-h); border-color: #C9D7FF; }
      .x-card strong { display: block; font-size: 16px; margin-bottom: 2px; }
      .x-card .x-cb > span { display: block; font-size: 14px; color: var(--muted); line-height: 1.45; }
      .x-card.is-soon { background: #FAFBFD; box-shadow: none; cursor: default; }
      .x-card.is-soon .x-ic { background: #EEF1F6; color: #8590A6; }
      .x-card.is-soon strong { color: #4A5571; }
      .x-ic { flex: none; width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; background: linear-gradient(135deg, #E8EEFF, #D6E1FF); color: var(--blue); }
      .x-pill { display: inline-block; margin-top: 8px; padding: 2px 10px; border-radius: 999px; background: #EEF1F6; color: #4A5571; font-size: 12px; font-weight: 600; }
      .x-cat-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 14px; }
      .x-cat-head a { display: inline-flex; align-items: center; min-height: 44px; color: var(--blue); font-weight: 600; font-size: 15px; }

      /* how it works, faq */
      .x-steps { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; counter-reset: s; list-style: none; padding: 0; margin: 16px 0 0; }
      .x-steps li { counter-increment: s; padding: 20px; border-radius: 18px; background: var(--soft); }
      .x-steps li::before { content: counter(s); display: grid; place-items: center; width: 34px; height: 34px; border-radius: 10px; background: var(--blue); color: #fff; font-weight: 700; margin-bottom: 12px; }
      .x-steps strong { display: block; margin-bottom: 2px; }
      .x-steps span { color: var(--muted); font-size: 15px; }
      .x-faq { display: grid; gap: 10px; margin-top: 16px; max-width: 820px; }
      .x-faq details { border: 1px solid var(--line); border-radius: 14px; background: #fff; padding: 0 18px; }
      .x-faq summary { cursor: pointer; font-weight: 600; padding: 14px 0; min-height: 44px; list-style: none; display: flex; justify-content: space-between; gap: 12px; }
      .x-faq summary::after { content: "+"; color: var(--blue); font-size: 20px; line-height: 1; transition: transform .2s; }
      .x-faq details[open] summary::after { transform: rotate(45deg); }
      .x-faq details p { padding-bottom: 14px; }

      /* ads */
      .ad-slot { display: grid; place-items: center; min-height: 100px; margin: 32px auto 0; max-width: 1080px; width: calc(100% - 40px); border: 1.5px dashed #C7CFDE; border-radius: 14px; color: #5F6B82; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; }

      /* tool page */
      .x-crumb { display: flex; flex-wrap: wrap; gap: 6px; font-size: 14px; color: var(--muted); padding: 22px 0 10px; list-style: none; margin: 0; }
      .x-crumb li + li::before { content: "/"; margin-right: 6px; color: #A9B2C5; }
      .x-crumb a { color: var(--blue); }
      .x-page h1 { font-size: clamp(28px, 4.5vw, 42px); font-weight: 800; }
      .x-page > .x-wrap > .x-lead { margin: 8px 0 22px; font-size: 17px; }
      .x-ws { border-radius: 22px; background: #fff; border: 1px solid var(--line); box-shadow: var(--sh); padding: 18px; }
      .x-drop { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; text-align: center; min-height: 220px; border: 2px dashed #B9C8EE; border-radius: 16px; background: #F7F9FF; cursor: pointer; padding: 24px; transition: background .2s, border-color .2s; }
      .x-drop:hover, .x-drop.is-over { background: #EDF2FF; border-color: var(--blue); }
      .x-drop .x-ic { width: 56px; height: 56px; border-radius: 16px; margin-bottom: 6px; }
      .x-drop strong { font-size: 17px; }
      .x-drop u { color: var(--blue); text-underline-offset: 3px; }
      .x-drop .x-note { color: var(--muted); font-size: 14px; }
      .x-app [hidden] { display: none !important; }
      .x-chip svg { vertical-align: -4px; margin-right: 4px; }
      .x-state { font-size: 14px; }
      .x-err { margin-top: 12px; padding: 12px 14px; border-radius: 12px; background: #FFF1F1; color: #B42318 !important; border: 1px solid #FBD0CC; font-weight: 550; }
      .x-src { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: baseline; font-size: 14px; color: var(--muted); padding: 2px 2px 14px; border-bottom: 1px solid var(--line); margin-bottom: 16px; }
      .x-src b { color: var(--navy); word-break: break-all; }
      .x-grid { display: grid; gap: 20px; }
      @media (min-width: 860px) { .x-grid { grid-template-columns: 320px minmax(0, 1fr); } }
      .x-ctrls { display: grid; gap: 14px; align-content: start; }
      .x-ctrls label { display: grid; gap: 6px; font-size: 14px; font-weight: 600; }
      .x-ctrls input[type=number], .x-ctrls select { height: 44px; border: 1.5px solid var(--line); border-radius: 12px; padding: 0 12px; background: #fff; width: 100%; outline: none; }
      .x-ctrls input:focus, .x-ctrls select:focus { border-color: var(--blue); }
      .x-ctrls input[type=range] { width: 100%; accent-color: var(--blue); height: 28px; }
      .x-ctrls .x-check { display: flex; align-items: center; gap: 10px; min-height: 44px; font-weight: 550; cursor: pointer; }
      .x-check input { width: 20px; height: 20px; accent-color: var(--blue); }
      .x-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
      .x-lbl { font-size: 14px; font-weight: 600; color: var(--navy) !important; margin-bottom: -6px !important; }
      .x-chips { display: flex; flex-wrap: wrap; gap: 8px; }
      .x-chip { min-height: 44px; padding: 6px 14px; border-radius: 12px; border: 1.5px solid var(--line); background: #fff; cursor: pointer; font-size: 14px; font-weight: 600; text-align: left; line-height: 1.2; transition: border-color .2s, background .2s; }
      .x-chip small { display: block; font-weight: 450; color: var(--muted); font-size: 12px; }
      .x-chip:hover { border-color: var(--blue); background: #F4F7FF; }
      .x-chip.is-on { border-color: var(--blue); background: #E8EEFF; color: var(--blue); }
      .x-prev { position: relative; display: grid; place-items: center; min-height: 240px; border-radius: 16px; padding: 12px; background: #fff conic-gradient(#EEF1F6 25%, #fff 0 50%, #EEF1F6 0 75%, #fff 0) 0 0 / 20px 20px; border: 1px solid var(--line); }
      .x-prev img { max-width: 100%; max-height: 60vh; object-fit: contain; border-radius: 6px; box-shadow: 0 2px 12px rgba(11,27,63,.12); }
      .x-spin { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(255,255,255,.7); border-radius: 16px; }
      .x-spin::after { content: ""; width: 38px; height: 38px; border-radius: 50%; border: 4px solid #D6E1FF; border-top-color: var(--blue); animation: x-rot .8s linear infinite; }
      @keyframes x-rot { to { transform: rotate(360deg); } }
      .x-info { margin-top: 12px; font-weight: 600; color: var(--navy) !important; }
      .x-extra:empty { display: none; }
      .x-extra { margin-top: 8px; padding: 10px 14px; border-radius: 12px; background: var(--soft); font-size: 15px; }
      .x-extra.is-warn { background: #FFF7E6; color: #8A5300 !important; }
      .x-extra a { color: var(--blue); font-weight: 600; text-decoration: underline; }
      .x-good { color: #12805C; font-weight: 700; }
      .x-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 14px; }
      .x-btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 0 22px; border-radius: 14px; font-weight: 650; font-size: 16px; cursor: pointer; border: 1.5px solid var(--line); background: #fff; color: var(--navy); transition: background .2s, transform .15s, opacity .2s; }
      .x-btn:active { transform: scale(.98); }
      .x-primary { background: var(--blue); border-color: var(--blue); color: #fff !important; }
      .x-primary:hover { background: var(--blue-d); }
      .x-btn.is-busy { opacity: .5; pointer-events: none; }
      .x-hint { font-size: 13px; margin-top: 10px; }
      .x-body { max-width: 820px; }
      .x-body ol.x-how { padding-left: 22px; margin: 12px 0 0; display: grid; gap: 8px; color: var(--muted); }
      .x-body ol.x-how li::marker { color: var(--blue); font-weight: 700; }
      .x-body p + p { margin-top: 12px; }
      .x-ctrls input[type=text], .x-ctrls input[type=color] { height: 44px; border: 1.5px solid var(--line); border-radius: 12px; padding: 0 12px; background: #fff; width: 100%; outline: none; }
      .x-ctrls input[type=color] { padding: 4px; cursor: pointer; }
      .x-crop { display: grid; place-items: center; margin-bottom: 18px; padding: 12px; border-radius: 16px; background: var(--soft); border: 1px solid var(--line); }
      .x-crop canvas { touch-action: none; cursor: move; max-width: 100%; border-radius: 4px; outline: none; }
      .x-crop canvas:focus-visible { box-shadow: 0 0 0 3px var(--blue); }
      .x-plist { place-items: stretch; align-content: start; background: var(--soft); }
      .x-thumbs { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; align-content: start; }
      .x-thumbs li { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; padding: 6px; border-radius: 12px; background: #fff; border: 1px solid var(--line); }
      .x-prev .x-thumbs img { width: 56px; height: 56px; object-fit: cover; border-radius: 8px; flex: none; box-shadow: none; }
      .x-tn { flex: 1 1 120px; min-width: 0; font-size: 13px; color: var(--muted); }
      .x-tn b { display: block; font-size: 14px; color: var(--navy); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .x-tb { display: flex; gap: 6px; margin-left: auto; }
      .x-ib { width: 44px; height: 44px; border-radius: 10px; border: 1.5px solid var(--line); background: #fff; cursor: pointer; display: grid; place-items: center; font-size: 18px; color: var(--navy); }
      .x-ib:hover:not(:disabled) { border-color: var(--blue); }
      .x-ib:disabled { opacity: .35; cursor: default; }
      .x-prose h2 { margin: 28px 0 8px; font-size: 21px; }
      .x-prose a { color: var(--blue); text-decoration: underline; }

      /* footer */
      .x-foot { margin-top: 32px; background: var(--navy); color: #C9D2E6; padding: 40px 0 28px; }
      .x-foot .x-logo { color: #fff; }
      .x-foot p { color: #9AA6C2; font-size: 14px; }
      .x-fgrid { display: grid; gap: 24px; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); }
      .x-foot h3 { color: #fff; font-size: 14px; text-transform: uppercase; letter-spacing: .06em; margin-bottom: 8px; }
      .x-foot ul { list-style: none; margin: 0; padding: 0; }
      .x-foot li a { display: inline-flex; align-items: center; min-height: 44px; min-width: 44px; color: #C9D2E6; font-size: 15px; }
      .x-foot li a:hover { color: #fff; }
      .x-copy { margin-top: 24px; padding-top: 18px; border-top: 1px solid rgba(255,255,255,.12); }
    </style>
    <style>
      /* ui-fx: button motion, ripple, pop, card stagger */
      button, .btn { transition: transform 150ms var(--ease-out, ease-out), box-shadow 150ms var(--ease-out, ease-out), background-color 150ms, border-color 150ms; }
      @media (hover: hover) and (pointer: fine) {
        button:not(:disabled):hover, .btn:hover { transform: translateY(-2px); box-shadow: var(--sh-h, 0 6px 16px rgba(16, 24, 40, .12)); }
        a.x-card:hover .x-ic { animation: x-fx-wiggle 420ms var(--ease-out, ease-out); }
      }
      button:not(:disabled):active, .btn:active, a.x-card:active { transform: scale(.96); }
      .x-fx-ripple { position: absolute; border-radius: 50%; background: currentColor; opacity: .18; transform: scale(0); pointer-events: none; animation: x-fx-ripple 450ms ease-out forwards; }
      .x-fx-pop { animation: x-fx-pop 280ms var(--ease-out, ease-out); }
      .x-fx-up { opacity: 0; }
      .x-fx-up.x-fx-in { animation: x-fx-up 420ms var(--ease-out, ease-out) both; }
      .x-fx-mute { position: fixed; right: 16px; bottom: 16px; z-index: 60; width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--stroke-secondary); background: var(--fill-primary-on); box-shadow: var(--hark-shadow, 0 4px 14px rgba(0, 0, 0, .12)); font-size: 18px; line-height: 1; cursor: pointer; display: grid; place-items: center; }
      @keyframes x-fx-ripple { to { transform: scale(1); opacity: 0; } }
      @keyframes x-fx-pop { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.08); } }
      @keyframes x-fx-up { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
      @keyframes x-fx-wiggle { 25% { transform: rotate(-8deg); } 50% { transform: rotate(6deg); } 75% { transform: rotate(-3deg); } }
      @media (prefers-reduced-motion: reduce) {
        button, .btn, a.x-card { transition: none !important; }
        button:hover, .btn:hover, button:active, .btn:active, a.x-card:hover, a.x-card:active { transform: none !important; }
        .x-fx-ripple, .x-fx-pop, .x-fx-up, .x-fx-up.x-fx-in, a.x-card:hover .x-ic { animation: none !important; opacity: 1 !important; }
      }
    </style>

        const ws = workspace(m, {
          suffix: "cropped", manual: true,
          top: `<div class="x-crop"><canvas tabindex="0" role="img" aria-label="Crop area. Drag to move, drag a corner to resize, or use the arrow keys."></canvas></div>`,
          controls: `<p class="x-lbl">Aspect ratio</p><div class="x-chips">${AR.map(([n, v, l], i) => `<button type="button" class="x-chip${i ? "" : " is-on"}" data-act="ar" data-v="${v}">${n}${l ? `<small>${l}</small>` : ""}</button>`).join("")}</div>
            <p class="x-state x-csize" aria-live="polite"></p>
            <button type="button" class="x-btn x-primary" data-act="crop">${ic("crop", 20)} Crop</button>
            <p class="x-hint">Drag inside the box to move it, or drag a corner to resize.</p>`,
          init(ws) { ar = 0; R = cropFit(0, ws.S.w, ws.S.h); draw(); m.querySelector(".x-info").textContent = "Tap Crop to see the result here."; },
          onAct(a, b, ws) {
            if (a === "crop") return;
            clearOn(ws); b.classList.add("is-on"); ar = +b.dataset.v;
            if (ar) R = cropFit(ar, ws.S.w, ws.S.h);
            draw(); return false;
          },
          process(S) {
            const x0 = Math.round(R.x), y0 = Math.round(R.y), w = Math.max(1, Math.min(S.w - x0, Math.round(R.w))), h = Math.max(1, Math.min(S.h - y0, Math.round(R.h)));
            const [c, x] = canvasOf(w, h, S.type === "image/jpeg");
            x.drawImage(S.img, x0, y0, w, h, 0, 0, w, h);
            return { canvas: c, mime: S.type, q: 0.92 };
          },
        });
        const cv = m.querySelector(".x-crop canvas"), cx = cv.getContext("2d");
        function draw() {
          const S = ws.S;
          if (!S || !R || !cv.isConnected) return;
          const box = cv.parentNode, k = Math.min((box.clientWidth - 24 || 600) / S.w, Math.max(240, innerHeight * 0.6) / S.h, 1), d = devicePixelRatio || 1;
          const w = Math.max(1, Math.round(S.w * k)), h = Math.max(1, Math.round(S.h * k));
          if (cv.width !== Math.round(w * d) || cv.height !== Math.round(h * d)) { cv.width = Math.round(w * d); cv.height = Math.round(h * d); cv.style.width = w + "px"; cv.style.height = h + "px"; }
          cx.setTransform(d * k, 0, 0, d * k, 0, 0);
          cx.clearRect(0, 0, S.w, S.h); cx.drawImage(S.img, 0, 0);
          cx.fillStyle = "rgba(11,27,63,.55)"; cx.beginPath(); cx.rect(0, 0, S.w, S.h); cx.rect(R.x, R.y, R.w, R.h); cx.fill("evenodd");
          cx.lineWidth = 2 / k; cx.strokeStyle = "#fff"; cx.strokeRect(R.x, R.y, R.w, R.h);
          const hs = 14 / k;
          cx.fillStyle = "#fff"; cx.strokeStyle = "#2563FF";
          [[R.x, R.y], [R.x + R.w, R.y], [R.x, R.y + R.h], [R.x + R.w, R.y + R.h]].forEach(([a, b]) => { cx.fillRect(a - hs / 2, b - hs / 2, hs, hs); cx.strokeRect(a - hs / 2, b - hs / 2, hs, hs); });
          m.querySelector(".x-csize").textContent = `Crop size: ${Math.round(R.w)} × ${Math.round(R.h)} px`;
        }
        const pt = (e) => { const b = cv.getBoundingClientRect(); return [((e.clientX - b.left) / b.width) * ws.S.w, ((e.clientY - b.top) / b.height) * ws.S.h]; };
        cv.addEventListener("pointerdown", (e) => {
          if (!ws.S || !R) return;
          const [x, y] = pt(e), tol = (24 * ws.S.w) / cv.getBoundingClientRect().width;
          const cs = [[R.x, R.y], [R.x + R.w, R.y], [R.x, R.y + R.h], [R.x + R.w, R.y + R.h]];
          const i = cs.findIndex(([a, b]) => Math.abs(a - x) < tol && Math.abs(b - y) < tol);
          if (i >= 0) drag = { ax: cs[3 - i][0], ay: cs[3 - i][1], sx: i % 2 ? 1 : -1, sy: i > 1 ? 1 : -1 };
          else if (x > R.x && x < R.x + R.w && y > R.y && y < R.y + R.h) drag = { mx: x - R.x, my: y - R.y };
          else return;
          cv.setPointerCapture(e.pointerId); e.preventDefault();
        });
        cv.addEventListener("pointermove", (e) => {
          if (!drag) return;
          const [x, y] = pt(e), S = ws.S;
          R = "mx" in drag ? cropMove(R, x - drag.mx, y - drag.my, S.w, S.h) : cropResize(drag, x, y, ar, S.w, S.h);
          draw();
        });
        ["pointerup", "pointercancel"].forEach((ev) => cv.addEventListener(ev, () => (drag = null)));
        cv.addEventListener("keydown", (e) => {
          const v = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] }[e.key];
          if (!v || !R) return;
          e.preventDefault();
          const st = Math.max(1, Math.round(ws.S.w / (e.shiftKey ? 20 : 100)));
          R = cropMove(R, R.x + v[0] * st, R.y + v[1] * st, ws.S.w, ws.S.h); draw();
        });
        addEventListener("resize", draw);
        return ws;
      }

      function toolEditor(m) {
        const FX = { none: ["None", []], grayscale: ["Grayscale", [["grayscale", 1]]], sepia: ["Sepia", [["sepia", 1]]],
          vintage: ["Vintage", [["sepia", 0.45], ["contrast", 0.9], ["brightness", 1.05], ["saturate", 0.85]], "rgba(255,190,110,.18)"],
          warm: ["Warm", [["sepia", 0.15], ["saturate", 1.15]], "rgba(255,140,40,.2)"], cool: ["Cool", [["saturate", 0.9]], "rgba(40,120,255,.2)"],
          vivid: ["Vivid", [["saturate", 1.6], ["contrast", 1.15]]] };
        const POS = [["br", "Bottom right"], ["bl", "Bottom left"], ["tr", "Top right"], ["tl", "Top left"], ["c", "Center"]];
        let FOK;
        const filterOK = () => {
          if (FOK === undefined) try { const [, x] = canvasOf(1, 1); x.filter = "grayscale(1)"; x.fillStyle = "#f00"; x.fillRect(0, 0, 1, 1); const p = x.getImageData(0, 0, 1, 1).data; FOK = p[0] === p[1]; } catch (e) { FOK = false; }
          return FOK;
        };
        const range = (t, n, min, max, v) => `<label>${lbl(t, n, v)}<input type="range" name="${n}" min="${min}" max="${max}" value="${v}"></label>`;
        return workspace(m, {
          suffix: "edited",
          controls: `${range("Brightness (%)", "b", 0, 200, 100)}${range("Contrast (%)", "c", 0, 200, 100)}${range("Saturation (%)", "s", 0, 200, 100)}
            <p class="x-lbl">Filter</p><div class="x-chips">${Object.entries(FX).map(([k, v]) => `<button type="button" class="x-chip${k === "none" ? " is-on" : ""}" data-act="fx" data-v="${k}">${v[0]}</button>`).join("")}</div>
            <p class="x-lbl">Border</p>${range("Width (px)", "bw", 0, 60, 0)}
            <div class="x-row"><label>Colour<input type="color" name="bc" value="#ffffff"></label><label>Frame<select name="fr"><option value="solid">Solid</option><option value="round">Rounded</option><option value="polaroid">Polaroid</option></select></label></div>
            <p class="x-lbl">Watermark</p><label>Text<input type="text" name="wt" maxlength="60" placeholder="e.g. © Your name"></label>
            <div class="x-row">${range("Size (%)", "wz", 2, 20, 6)}${range("Opacity (%)", "wo", 10, 100, 60)}</div>
            <div class="x-row"><label>Colour<input type="color" name="wc" value="#ffffff"></label><label>Position<select name="wp">${POS.map(([v, t]) => `<option value="${v}">${t}</option>`).join("")}</select></label></div>
            <label>Save as<select name="f"><option value="image/jpeg">JPG</option><option value="image/png">PNG</option></select></label>`,
          init(ws) { ws.S.fx = "none"; ws.val("f").value = ws.S.type === "image/png" ? "image/png" : "image/jpeg"; },
          onAct(a, b, ws) { clearOn(ws); b.classList.add("is-on"); ws.S.fx = b.dataset.v; },
          process(S, ws) {
            const v = (n) => ws.val(n).value, png = v("f") === "image/png", P = FX[S.fx];
            const ops = [["brightness", v("b") / 100], ["contrast", v("c") / 100], ["saturate", v("s") / 100], ...P[1]];
            const [f, fx] = canvasOf(S.w, S.h);
            if (filterOK()) { fx.filter = ops.map(([n, x]) => `${n}(${x})`).join(" "); fx.drawImage(S.img, 0, 0); fx.filter = "none"; }
            else {
              fx.drawImage(S.img, 0, 0);
              if (ops.some(([n, x]) => (n === "grayscale" || n === "sepia" ? x : x !== 1))) { const d = fx.getImageData(0, 0, S.w, S.h); applyMatrix(d.data, fxMatrix(ops)); fx.putImageData(d, 0, 0); }
            }
            if (P[2]) {
              fx.globalCompositeOperation = "overlay"; fx.fillStyle = P[2]; fx.fillRect(0, 0, S.w, S.h);
              fx.globalCompositeOperation = "destination-in"; fx.drawImage(S.img, 0, 0); fx.globalCompositeOperation = "source-over";
            }
            const bw = +v("bw"), fr = v("fr"), B = frameBox(S.w, S.h, bw, fr), [c, x] = canvasOf(B.W, B.H, !png);
            const rr = (a, b, w, h, r) => { r = Math.min(r, w / 2, h / 2); x.beginPath(); x.moveTo(a + r, b); x.arcTo(a + w, b, a + w, b + h, r); x.arcTo(a + w, b + h, a, b + h, r); x.arcTo(a, b + h, a, b, r); x.arcTo(a, b, a + w, b, r); x.closePath(); };
            x.fillStyle = v("bc");
            if (B.rad) {
              if (bw) { rr(0, 0, B.W, B.H, B.rad + B.l); x.fill(); }
              x.save(); rr(B.l, B.t, S.w, S.h, B.rad); x.clip(); x.drawImage(f, B.l, B.t); x.restore();
            } else {
              if (bw || fr === "polaroid") x.fillRect(0, 0, B.W, B.H);
              x.drawImage(f, B.l, B.t);
            }
            f.width = f.height = 0;
            const wt = v("wt").trim();
            if (wt) {
              const px = Math.max(8, Math.round((Math.min(S.w, S.h) * v("wz")) / 100)), pad = Math.round(px * 0.6), p = v("wp"), C = p === "c", Rt = p[1] === "r", Bt = p[0] === "b";
              x.font = `600 ${px}px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif`;
              x.globalAlpha = v("wo") / 100; x.fillStyle = v("wc"); x.shadowColor = "rgba(0,0,0,.35)"; x.shadowBlur = px * 0.15;
              x.textAlign = C ? "center" : Rt ? "right" : "left"; x.textBaseline = C ? "middle" : Bt ? "bottom" : "top";
              x.fillText(wt, C ? B.l + S.w / 2 : Rt ? B.l + S.w - pad : B.l + pad, C ? B.t + S.h / 2 : Bt ? B.t + S.h - pad : B.t + pad, S.w - 2 * pad);
              x.globalAlpha = 1; x.shadowBlur = 0;
            }
            return { canvas: c, mime: v("f"), q: 0.92, strict: true };
          },
        });
      }

      function toolPdf(m) {
        m.innerHTML = `<div class="x-ws">
          <label class="x-drop" tabindex="0"><input type="file" multiple accept="image/jpeg,image/png,image/webp,.jpg,.jpeg,.png,.webp" class="x-sr" tabindex="-1" aria-label="Choose images">
            <span class="x-ic">${ic("upload", 28)}</span><strong>Drop images here or <u>tap to choose</u></strong>
            <span class="x-note">JPG, PNG or WEBP · <b>up to 20 images, max 20 MB each</b></span><span class="x-note">Processed on your device — nothing is uploaded.</span></label>
          <p class="x-err" role="alert" hidden></p>
          <div class="x-edit" hidden>
            <p class="x-src"><b class="x-fname"></b><span class="x-orig"></span></p>
            <div class="x-grid"><div class="x-ctrls">
              <label>Page size<select name="ps"><option value="a4">A4</option><option value="letter">Letter</option><option value="fit">Fit to image</option></select></label>
              <label>Orientation<select name="or"><option value="portrait">Portrait</option><option value="landscape">Landscape</option><option value="auto" selected>Auto</option></select></label>
              <label>Margin<select name="mg"><option value="0">None</option><option value="18" selected>Small</option><option value="36">Medium</option></select></label>
              <button type="button" class="x-btn x-add">+ Add more images</button>
              <button type="button" class="x-btn x-primary x-make">${ic("file", 20)} Create PDF</button></div>
              <div><div class="x-prev x-plist"><ol class="x-thumbs" aria-label="Pages in order"></ol><div class="x-spin" hidden role="status" aria-label="Processing"></div></div>
                <p class="x-state" aria-live="polite"></p><p class="x-info" aria-live="polite"></p>
                <div class="x-actions"><a class="x-btn x-primary x-dl is-busy" download="toolora.pdf">${ic("download", 20)} Download PDF</a><a class="x-btn x-dl2" download="toolora.pdf" hidden>Backup download</a><button type="button" class="x-btn x-reset">Reset</button></div>
                <p class="x-hint">If the download doesn't start, tap Backup download, or long-press it and choose to save the file.</p></div></div></div></div>`;
        const q = (s) => m.querySelector(s), input = q("input[type=file]"), drop = q(".x-drop"), err = q(".x-err"), edit = q(".x-edit"), list = q(".x-thumbs"),
          spin = q(".x-spin"), prog = q(".x-state"), info = q(".x-info"), dl = q(".x-dl"), dl2 = q(".x-dl2"), make = q(".x-make"), addB = q(".x-add");
        let items = [], url = "";
        const fail = (msg) => { err.textContent = msg; err.hidden = false; };
        const busy = (on) => { spin.hidden = !on; make.classList.toggle("is-busy", on); addB.classList.toggle("is-busy", on); };
        function clearOut() {
          if (url) URL.revokeObjectURL(url);
          url = ""; dl.removeAttribute("href"); dl2.removeAttribute("href"); dl.classList.add("is-busy"); dl2.hidden = true; info.textContent = "";
        }
        function render() {
          clearOut();
          if (!items.length) { edit.hidden = true; drop.hidden = false; return; }
          drop.hidden = true; edit.hidden = false; addB.disabled = items.length >= 20;
          q(".x-fname").textContent = `${items.length} image${items.length > 1 ? "s" : ""}`;
          q(".x-orig").textContent = `${fmtSize(items.reduce((a, b) => a + b.size, 0))} in total · up to 20`;
          list.innerHTML = items.map((it, i) => `<li><img src="${it.url}" alt=""><span class="x-tn"><b>${esc(it.name)}</b>Page ${i + 1} · ${it.w} × ${it.h} px · ${fmtSize(it.size)}</span>
            <span class="x-tb"><button type="button" class="x-ib" data-act="up" data-i="${i}" aria-label="Move ${esc(it.name)} up"${i ? "" : " disabled"}>↑</button><button type="button" class="x-ib" data-act="down" data-i="${i}" aria-label="Move ${esc(it.name)} down"${i < items.length - 1 ? "" : " disabled"}>↓</button><button type="button" class="x-ib" data-act="rm" data-i="${i}" aria-label="Remove ${esc(it.name)}">×</button></span></li>`).join("");
        }
        const readImg = (file) => new Promise((ok, no) => {
          const r = new FileReader();
          r.onerror = () => no();
          r.onload = () => { const im = new Image(); im.onerror = () => no(); im.onload = () => ok({ img: im, url: r.result, name: file.name, size: file.size, w: im.naturalWidth, h: im.naturalHeight }); im.src = r.result; };
          r.readAsDataURL(file);
        });
        async function add(files) {
          err.hidden = true;
          let fl = [...files];
          const bad = [], room = 20 - items.length;
          if (fl.length > room) { bad.push(`A PDF can hold up to 20 images, so ${fl.length - room} ${fl.length - room > 1 ? "were" : "was"} skipped.`); fl = fl.slice(0, Math.max(0, room)); }
          busy(true);
          try {
            for (const f of fl) {
              const msg = checkFile(f);
              if (msg) { bad.push(msg); continue; }
              try { items.push(await readImg(f)); } catch (e) { bad.push(`“${f.name}” couldn't be opened. It may be damaged.`); }
            }
          } finally { busy(false); render(); input.value = ""; if (bad.length) fail(bad.join(" ")); }
        }
        async function build() {
          if (!items.length) return fail("Add at least one image first.");
          err.hidden = true; clearOut(); busy(true);
          try {
            const sel = (n) => q(`[name="${n}"]`).value, pages = [];
            for (let i = 0; i < items.length; i++) {
              prog.textContent = `Processing image ${i + 1} of ${items.length}`;
              await new Promise((r) => setTimeout(r, 30));
              const it = items[i], k = Math.min(1, 4000 / Math.max(it.w, it.h)), w = Math.max(1, Math.round(it.w * k)), h = Math.max(1, Math.round(it.h * k));
              const [c, x] = canvasOf(w, h, true);
              x.drawImage(it.img, 0, 0, w, h);
              const u = c.toDataURL("image/jpeg", 0.85);
              c.width = c.height = 0;
              if (!u.startsWith("data:image/jpeg")) throw new Error(`Your browser couldn't turn “${it.name}” into a JPEG for the PDF.`);
              pages.push({ jpg: fromB64(u), iw: w, ih: h, ...pdfLayout(it.w, it.h, sel("ps"), sel("or"), +sel("mg")) });
            }
            prog.textContent = "Writing PDF…";
            await new Promise((r) => setTimeout(r, 30));
            const bytes = buildPdf(pages);
            url = URL.createObjectURL(new Blob([bytes], { type: "application/pdf" }));
            dl.href = url; dl2.href = "data:application/pdf;base64," + toB64(bytes); dl2.hidden = false; dl.classList.remove("is-busy");
            info.textContent = `PDF ready: ${pages.length} page${pages.length > 1 ? "s" : ""} · ${fmtSize(bytes.length)}`;
          } catch (e) {
            clearOut(); fail((e && e.message) || "Something went wrong while making the PDF. Try fewer or smaller images.");
          } finally { busy(false); prog.textContent = ""; }
        }
        input.addEventListener("change", () => add(input.files));
        drop.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); input.click(); } });
        [["dragenter", 1], ["dragover", 1], ["dragleave", 0], ["drop", 0]].forEach(([ev, on]) => m.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.toggle("is-over", !!on); }));
        m.addEventListener("drop", (e) => add(e.dataTransfer.files));
        addB.addEventListener("click", () => input.click());
        make.addEventListener("click", build);
        m.querySelectorAll("select").forEach((s) => s.addEventListener("change", clearOut));
        [dl, dl2].forEach((a) => a.addEventListener("click", (e) => { if (!a.getAttribute("href")) e.preventDefault(); }));
        list.addEventListener("click", (e) => {
          const b = e.target.closest("[data-act]");
          if (!b) return;
          const i = +b.dataset.i, j = b.dataset.act === "up" ? i - 1 : i + 1;
          if (b.dataset.act === "rm") items.splice(i, 1); else [items[i], items[j]] = [items[j], items[i]];
          render();
          const nb = list.querySelector(`[data-act="${b.dataset.act}"][data-i="${b.dataset.act === "rm" ? Math.min(i, items.length - 1) : j}"]`);
          if (nb && !nb.disabled) nb.focus();
        });
        q(".x-reset").addEventListener("click", () => { items = []; input.value = ""; err.hidden = true; render(); drop.focus(); });
      }

      window.Toolora = { tools: TOOLS, byId, cats: CATS, ic, esc, fmtSize, toB64, route };
      route();
    </script>
    <script src="pdf-tools.js"></script>
    <script src="video-tools.js"></script>
    <script src="text-tools.js"></script>
    <script src="creator-tools.js"></script>
    <script src="creator-tools-2.js"></script>
    <script src="ui-fx.js"></script>
  </body>
