<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Twitch test</title>
<style>body{font:16px system-ui,sans-serif;background:#0b0f1a;color:#eee;margin:0;padding:20px;max-width:520px}input,button{font:inherit;width:100%;box-sizing:border-box;padding:12px;border-radius:10px;border:1px solid #334;margin:6px 0;background:#141a2b;color:#eee}button{background:#2f80ff;border:0;font-weight:600}#out{white-space:pre-wrap;background:#141a2b;padding:12px;border-radius:10px;margin-top:10px;font-size:14px}</style></head>
<body><h2>Twitch link test</h2><p>Type a Twitch channel that is live now, or a VOD number.</p>
<input id="ch" placeholder="channel name, e.g. caseoh_" autocomplete="off">
<button id="go">Run test</button><div id="out">Waiting.</div>
<script>
var CID="kimne78kx3ncx6brgo4mv6wki5h1ko",out=document.getElementById("out");
function log(t){out.textContent+="\n"+t;}
function gql(q){return fetch("https://gql.twitch.tv/gql",{method:"POST",headers:{"Client-ID":CID},body:JSON.stringify({query:q})}).then(function(r){return r.json();});}
document.getElementById("go").onclick=function(){
  var v=document.getElementById("ch").value.trim().replace(/^.*twitch\.tv\/(videos\/)?/,"").replace(/[/?].*$/,"");
  if(!v){return;} var vod=/^\d+$/.test(v); out.textContent="Testing "+(vod?"VOD ":"channel ")+v+"…";
  var q=vod?'{ videoPlaybackAccessToken(id:"'+v+'", params:{platform:"web",playerBackend:"mediaplayer",playerType:"site"}){ value signature } }'
           :'{ streamPlaybackAccessToken(channelName:"'+v.toLowerCase()+'", params:{platform:"web",playerBackend:"mediaplayer",playerType:"site"}){ value signature } }';
  log("1. Asking Toolsaku server for the playlist…");
  fetch("/api/twitch-m3u8?"+(vod?"vod=":"ch=")+encodeURIComponent(v)).then(function(r){ if(r.ok) log("1. Token: OK"); return r; })
  .then(function(r){
    if(!r.ok)throw new Error("step 2 playlist: HTTP "+r.status);
    return r.text();
  }).then(function(m){
    var vs=m.split("\n").filter(function(l){return l.indexOf("http")===0;});
    log("2. Playlist: OK ("+vs.length+" qualities)");
    window.VU=vs[vs.length-1];
    return fetch("/api/twitch-var?u="+encodeURIComponent(window.VU)).catch(function(){throw new Error("step 3 quality list: blocked (CORS)");});
  }).then(function(r){
    if(!r.ok)throw new Error("step 3 quality list: HTTP "+r.status);
    return r.text();
  }).then(function(m){
    var segs=m.split("\n").filter(function(l){return l&&l[0]!=="#";});
    log("3. Quality list: OK ("+segs.length+" parts)");
    var s=new URL(segs[segs.length-1],window.VU).href;
    return fetch(s).catch(function(){throw new Error("step 4 video part: blocked (CORS)");});
  }).then(function(r){
    if(!r.ok)throw new Error("step 4 video part: HTTP "+r.status);
    return r.arrayBuffer();
  }).then(function(b){ log("4. Video part: OK ("+Math.round(b.byteLength/1024)+" KB)\n\nPASSED. Twitch mode can work."); })
  .catch(function(e){ log("FAILED at "+e.message); });
};
</script></body></html>
