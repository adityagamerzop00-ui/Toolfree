# Toolsaku speed + cache rules (included inside the site's HTTPS server block by server/deploy/nginx-perf.sh)

# ---- gzip (text/html is always included once gzip is on) ----
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 256;
gzip_types text/css application/javascript text/javascript application/json application/manifest+json image/svg+xml application/xml text/xml text/plain;

# ---- one canonical host: https://www.toolsak.online -> https://toolsak.online ----
if ($host = www.toolsak.online) { return 301 https://toolsak.online$request_uri; }

# ---- cache headers ($tsk_cache comes from /etc/nginx/conf.d/toolsaku-cache-map.conf) ----
add_header Cache-Control $tsk_cache always;

# trending.json is written by cron (server/trending.py). If it isn't there yet, answer 204 instead of 404.
location = /trending.json {
    try_files $uri =204;
    add_header Cache-Control "public, max-age=600" always;
}
