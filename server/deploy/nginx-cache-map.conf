# Toolsaku: Cache-Control value per request (http context; installed to /etc/nginx/conf.d/ by nginx-perf.sh)
map $request_uri $tsk_cache {
    default                                                   "public, max-age=600";
    ~*\.(css|js|svg|png|jpe?g|webp|gif|ico|woff2?)\?v=        "public, max-age=31536000, immutable";
    ~*\.(png|jpe?g|webp|gif|ico|svg|woff2?)(\?|$)             "public, max-age=604800";
    ~*\.(css|js)(\?|$)                                        "public, max-age=3600";
}
